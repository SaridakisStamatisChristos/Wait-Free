name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_format.py

  build-test:
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        standard: [20, 23]
    name: ${{ matrix.compiler }} / C++${{ matrix.standard }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure compiler
        run: |
          if [ "${{ matrix.compiler }}" = gcc ]; then
            echo 'CC=gcc' >> "$GITHUB_ENV"
            echo 'CXX=g++' >> "$GITHUB_ENV"
          else
            echo 'CC=clang' >> "$GITHUB_ENV"
            echo 'CXX=clang++' >> "$GITHUB_ENV"
          fi
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_STANDARD=${{ matrix.standard }}
          -DCMAKE_CXX_STANDARD_REQUIRED=ON
          -DCMAKE_CXX_EXTENSIONS=OFF
      - name: Build
        run: cmake --build build -j2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  single-owner-build-test:
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        standard: [20, 23]
    name: single-owner / ${{ matrix.compiler }} / C++${{ matrix.standard }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure compiler
        run: |
          if [ "${{ matrix.compiler }}" = gcc ]; then
            echo 'CC=gcc' >> "$GITHUB_ENV"
            echo 'CXX=g++' >> "$GITHUB_ENV"
          else
            echo 'CC=clang' >> "$GITHUB_ENV"
            echo 'CXX=clang++' >> "$GITHUB_ENV"
          fi
      - name: Configure forced single-owner verification build
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_STANDARD=${{ matrix.standard }}
          -DCMAKE_CXX_STANDARD_REQUIRED=ON
          -DCMAKE_CXX_EXTENSIONS=OFF
          -DVERIQUEUE_TEST_FORCE_SINGLE_OWNER_CURSOR=ON -DVERIQUEUE_TEST_FORCE_PROGRESS_CACHE_STORE=ON
      - name: Build
        run: cmake --build build -j2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy ninja-build
      - name: Configure compile database
        run: cmake -S . -B build/tidy -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DVERIQUEUE_BUILD_STRESS=OFF
      - name: Analyze public header consumers
        run: |
          clang-tidy tests/unit/test_basic.cpp tests/unit/test_bulk.cpp tests/unit/test_lifetime.cpp tests/unit/test_wraparound.cpp \
            -p build/tidy

  benchmark-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install baseline dependency
        run: sudo apt-get update && sudo apt-get install -y libboost-dev
      - name: Configure all benchmark targets
        run: >-
          cmake -S . -B build/bench -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DVERIQUEUE_BUILD_TESTS=OFF -DVERIQUEUE_BUILD_STRESS=OFF
          -DVERIQUEUE_BUILD_BENCHMARKS=ON -DVERIQUEUE_BUILD_BASELINES=ON
      - name: Build benchmark laboratory
        run: cmake --build build/bench -j2
      - name: Correctness smoke for every comparative adapter
        run: |
          for implementation in veriqueue rigtorp boost_lockfree moodycamel drogalis; do
            echo "checking $implementation"
            ./build/bench/bench_compare "$implementation" 64 8 50000
          done
      - name: Bulk API correctness and performance smoke
        run: ./build/bench/bench_bulk 50000
      - name: Matrix compile/runtime edge smoke
        run: |
          ./build/bench/bench_compare veriqueue 2 256 2000
          ./build/bench/bench_compare rigtorp 65536 16 2000
          ./build/bench/bench_compare boost_lockfree 256 64 2000
          ./build/bench/bench_compare moodycamel 1024 256 2000
          ./build/bench/bench_compare drogalis 65536 8 2000
      - name: Paired statistics smoke
        run: |
          mkdir -p /tmp/veriqueue-paired
          python tools/run_compare_campaign.py \
            --program build/bench/bench_compare \
            --capacities 64 --payloads 8 --transfers 10000 \
            --warmups 0 --repetitions 2 \
            --output /tmp/veriqueue-paired/raw.jsonl
          python tools/analyze_compare_campaign.py \
            /tmp/veriqueue-paired/raw.jsonl \
            --json-output /tmp/veriqueue-paired/summary.json \
            --markdown-output /tmp/veriqueue-paired/summary.md
          cat /tmp/veriqueue-paired/summary.md
      - name: Assembly audit
        run: CXX=c++ tools/audit_assembly.sh /tmp/veriqueue-assembly.s

  qualification-evidence:
    needs: [format, build-test, single-owner-build-test, clang-tidy, benchmark-build]
    runs-on: ubuntu-24.04
    steps:
      - name: Write CI qualification manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/qualification
          cat > evidence/qualification/ci.json <<EOF
          {
            "workflow": "CI",
            "github_sha": "$GITHUB_SHA",
            "github_run_id": "$GITHUB_RUN_ID",
            "github_run_attempt": "$GITHUB_RUN_ATTEMPT",
            "format": "success",
            "build_test_matrix": "success",
            "single_owner_build_test_matrix": "success",
            "clang_tidy": "success",
            "benchmark_build": "success"
          }
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: ci-qualification-evidence
          path: evidence/qualification/ci.json

