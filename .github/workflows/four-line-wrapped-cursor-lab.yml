name: Four-Line Wrapped Cursor Lab

on:
  pull_request:
    paths:
      - 'bench/four_line_wrapped_variants.hpp'
      - 'bench/bench_four_line_wrapped_compare.cpp'
      - '.github/workflows/four-line-wrapped-cursor-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: four-line-wrapped-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  CANDIDATES: veriqueue,grouped_inline,four_line_inline,four_line_heap
  EXTERNALS: rigtorp,boost_lockfree,moodycamel,drogalis
  IMPLEMENTATIONS: veriqueue,grouped_inline,four_line_inline,four_line_heap,rigtorp,boost_lockfree,moodycamel,drogalis

jobs:
  tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate tooling
        run: |
          python -m py_compile tools/run_comparator_campaign.py tools/analyze_policy_campaign.py
          python tools/test_policy_campaign.py
      - name: Compile candidate smoke
        run: |
          g++ -std=c++20 -O3 -DNDEBUG -pthread \
            -Wall -Wextra -Wpedantic -Wconversion -Wshadow \
            -Wold-style-cast -Wcast-align -Wundef -Werror \
            -Iinclude -Ibench -x c++ -o /tmp/four-line-smoke - <<'CPP'
          #include "four_line_wrapped_variants.hpp"
          #include <cstdint>
          struct p16 { std::uint64_t a; std::uint64_t b; };
          int main() {
              vqbench::experimental::four_line_wrapped::four_line_inline<p16, 64> q;
              p16 in{1, 2}, out{};
              if (!q.try_push(in) || !q.try_pop(out)) return 1;
              return out.a == 1 && out.b == 2 ? 0 : 2;
          }
          CPP
          /tmp/four-line-smoke

  compare:
    name: arm64 / ${{ matrix.compiler }} / cap-${{ matrix.capacity }}
    needs: tooling
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        capacity: [64, 256, 1024, 65536]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libboost-dev clang
      - name: Select compiler
        id: compiler
        shell: bash
        run: |
          if [[ "${{ matrix.compiler }}" == "gcc" ]]; then
            echo "cc=gcc" >> "$GITHUB_OUTPUT"
            echo "cxx=g++" >> "$GITHUB_OUTPUT"
            echo "id=1" >> "$GITHUB_OUTPUT"
          else
            echo "cc=clang" >> "$GITHUB_OUTPUT"
            echo "cxx=clang++" >> "$GITHUB_OUTPUT"
            echo "id=2" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch pinned comparators
        env:
          CC: ${{ steps.compiler.outputs.cc }}
          CXX: ${{ steps.compiler.outputs.cxx }}
        run: |
          cmake -S . -B build/four-line -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DVERIQUEUE_BUILD_TESTS=OFF \
            -DVERIQUEUE_BUILD_STRESS=OFF \
            -DVERIQUEUE_BUILD_BENCHMARKS=OFF \
            -DVERIQUEUE_BUILD_BASELINES=ON
      - name: Compile comparator
        env:
          CXX: ${{ steps.compiler.outputs.cxx }}
        run: |
          "$CXX" -std=c++20 -O3 -DNDEBUG -pthread \
            -Wall -Wextra -Wpedantic -Wconversion -Wshadow \
            -Wold-style-cast -Wcast-align -Wundef -Werror \
            -DVERIQUEUE_POLICY_CAPACITY=${{ matrix.capacity }} \
            -Iinclude -Ibench \
            -isystem build/four-line/_deps/rigtorp_spsc-src/include \
            -isystem build/four-line/_deps/moodycamel_readerwriterqueue-src \
            -isystem build/four-line/_deps/drogalis_spsc-src/include \
            bench/bench_four_line_wrapped_compare.cpp bench/environment.cpp \
            -o build/four-line/bench_four_line_wrapped_compare
      - name: Run randomized paired campaign
        run: |
          seed=$((2026101700 + ${{ steps.compiler.outputs.id }} * 10000 + ${{ matrix.capacity }}))
          output="evidence/four-line/raw/arm64-${{ matrix.compiler }}-cap${{ matrix.capacity }}.jsonl"
          python tools/run_comparator_campaign.py \
            --program build/four-line/bench_four_line_wrapped_compare \
            --capacity "${{ matrix.capacity }}" \
            --payloads 8,16,64,256 \
            --implementations "$IMPLEMENTATIONS" \
            --transfers 1000000 \
            --warmups 5 \
            --repetitions 30 \
            --seed "$seed" \
            --lane "arm64-${{ matrix.compiler }}" \
            --architecture arm64 \
            --compiler "${{ matrix.compiler }}" \
            --source-commit "$SOURCE_COMMIT" \
            --output "$output"
      - uses: actions/upload-artifact@v4
        with:
          name: four-line-${{ matrix.compiler }}-cap${{ matrix.capacity }}
          path: evidence/four-line/raw/*.jsonl
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: aggregate-four-line-results
    needs: compare
    if: ${{ always() && needs.compare.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: four-line-*
          path: evidence/four-line/shards
          merge-multiple: true
      - name: Analyze
        run: |
          python tools/analyze_policy_campaign.py evidence/four-line/shards \
            --candidates "$CANDIDATES" \
            --externals "$EXTERNALS" \
            --json-output evidence/four-line/summary.json \
            --markdown-output evidence/four-line/summary.md \
            --csv-output evidence/four-line/cells.csv \
            --bootstrap-seed 20261017 \
            --bootstrap-samples 20000
          cat evidence/four-line/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: four-line-summary
          path: evidence/four-line
          if-no-files-found: error
          retention-days: 90
