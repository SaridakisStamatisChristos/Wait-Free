name: ARM64 8B Bulk Diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/arm64-8b-bulk-diagnostic.yml'

permissions:
  contents: read

env:
  CURRENT: 4c194617d5bded91ecb58063607c3fab47fc1db9
  PRE_OPT: d1382588262b2275ecde9bf1a6948e67fcd056f3

jobs:
  side-isolation:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 55
    steps:
      - name: Checkout identical current trees
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CURRENT }}
          path: current
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CURRENT }}
          path: push
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CURRENT }}
          path: pop
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CURRENT }}
          path: old
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Inject old header and one-sided candidates
        run: |
          git -C old fetch --no-tags --depth=1 origin "$PRE_OPT"
          git -C old show FETCH_HEAD:include/veriqueue/spsc_queue.hpp > old/include/veriqueue/spsc_queue.hpp
          python3 - <<'PY'
          from pathlib import Path
          macro_anchor = '#if defined(__aarch64__) || defined(_M_ARM64)\n#define VERIQUEUE_DETAIL_ARM64_STORAGE_STRIPE 1\n#else\n#define VERIQUEUE_DETAIL_ARM64_STORAGE_STRIPE 0\n#endif\n'
          macro = macro_anchor + '\n#if defined(__aarch64__) && defined(__GNUC__) && !defined(__clang__)\n#define VQ_GCC_ARM64_BULK_OPT __attribute__((optimize("unroll-loops")))\n#else\n#define VQ_GCC_ARM64_BULK_OPT\n#endif\n'
          push_marker = '    [[nodiscard]] std::size_t try_push_bulk(std::span<const T> values) noexcept\n'
          pop_marker = '    [[nodiscard]] std::size_t try_pop_bulk(std::span<T> output) noexcept\n'
          undef = '#undef VERIQUEUE_DETAIL_ARM64_STORAGE_STRIPE\n#undef VERIQUEUE_DETAIL_ARM64_SINGLE_OWNER_CURSOR\n'
          for role, target in [('push', push_marker), ('pop', pop_marker)]:
              p = Path(role) / 'include/veriqueue/spsc_queue.hpp'
              s = p.read_text()
              if s.count(macro_anchor) != 1 or s.count(target) != 1 or s.count(undef) != 1:
                  raise SystemExit(role + ' anchors')
              s = s.replace(macro_anchor, macro, 1)
              s = s.replace(target, '    VQ_GCC_ARM64_BULK_OPT\n' + target, 1)
              s = s.replace(undef, '#undef VQ_GCC_ARM64_BULK_OPT\n' + undef, 1)
              p.write_text(s)
          PY
          test "$(git -C old diff --name-only)" = "include/veriqueue/spsc_queue.hpp"
          test "$(git -C push diff --name-only)" = "include/veriqueue/spsc_queue.hpp"
          test "$(git -C pop diff --name-only)" = "include/veriqueue/spsc_queue.hpp"
      - name: Build variants
        env:
          CC: gcc
          CXX: g++
        run: |
          for role in current push pop old; do
            cmake -S "$role" -B "build/$role" -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DVERIQUEUE_BUILD_TESTS=OFF -DVERIQUEUE_BUILD_STRESS=OFF \
              -DVERIQUEUE_BUILD_BENCHMARKS=ON -DVERIQUEUE_BUILD_BASELINES=OFF
            cmake --build "build/$role" --target bench_hotpath_variants -j2
          done
      - name: Make wrappers
        run: |
          for role in current push pop old; do
            for batch in 4 16 64; do
              printf '#!/usr/bin/env bash\nexec "%s/build/%s/bench_hotpath_variants" "$1" "$2" "$3" "$4" bulk %s\n' "$GITHUB_WORKSPACE" "$role" "$batch" > "build/${role}/bench_bulk_${batch}"
              chmod +x "build/${role}/bench_bulk_${batch}"
            done
          done
      - name: Compare one-sided variants
        run: |
          ROOT="push/evidence/side-isolation"
          mkdir -p "$ROOT"
          for role in push pop; do
            role_offset=0
            if [ "$role" = "pop" ]; then role_offset=200; fi
            for ref in current old; do
              ref_offset=0
              if [ "$ref" = "old" ]; then ref_offset=100; fi
              OUT="$ROOT/${role}-vs-${ref}"
              mkdir -p "$OUT"
              for batch in 4 16 64; do
                python push/tools/run_regression_campaign.py \
                  --candidate "$GITHUB_WORKSPACE/build/${role}/bench_bulk_${batch}" \
                  --reference "$GITHUB_WORKSPACE/build/${ref}/bench_bulk_${batch}" \
                  --capacities 256,1024 --payloads 8 --transfers 800000 \
                  --warmups 4 --repetitions 50 \
                  --seed "$((20262710 + batch + role_offset + ref_offset))" \
                  --output "$OUT/bulk${batch}-raw.jsonl"
                python push/tools/analyze_regression_campaign.py "$OUT/bulk${batch}-raw.jsonl" \
                  --json-output "$OUT/bulk${batch}-summary.json" \
                  --markdown-output "$OUT/bulk${batch}-summary.md" \
                  --bootstrap-seed "$((20262710 + batch + role_offset + ref_offset))" || true
                cat "$OUT/bulk${batch}-summary.md"
              done
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gcc-arm64-side-isolation
          path: push/evidence/side-isolation/
