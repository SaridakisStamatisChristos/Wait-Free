name: ARM64 8B Bulk Diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/arm64-8b-bulk-diagnostic.yml'

permissions:
  contents: read

env:
  PRE_OPT: d1382588262b2275ecde9bf1a6948e67fcd056f3

jobs:
  localized-unroll:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            compiler: gcc
            cc: gcc
            cxx: g++
          - runner: ubuntu-24.04-arm
            compiler: clang
            cc: clang
            cxx: clang++
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout identical current harnesses
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: current
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: attr
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: old
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - name: Inject historical header and localized attribute candidate
        run: |
          git -C old fetch --no-tags --depth=1 origin "$PRE_OPT"
          git -C old show FETCH_HEAD:include/veriqueue/spsc_queue.hpp > old/include/veriqueue/spsc_queue.hpp
          python3 - <<'PY'
          from pathlib import Path
          p = Path('attr/include/veriqueue/spsc_queue.hpp')
          s = p.read_text()
          marker_push = '    [[nodiscard]] std::size_t try_push_bulk(std::span<const T> values) noexcept\n'
          marker_pop = '    [[nodiscard]] std::size_t try_pop_bulk(std::span<T> output) noexcept\n'
          attr = '#if defined(__aarch64__) && defined(__GNUC__) && !defined(__clang__)\n    __attribute__((optimize("unroll-loops")))\n#endif\n'
          if s.count(marker_push) != 1 or s.count(marker_pop) != 1:
              raise SystemExit('bulk method markers not unique')
          s = s.replace(marker_push, attr + marker_push, 1)
          s = s.replace(marker_pop, attr + marker_pop, 1)
          p.write_text(s)
          PY
          test "$(git -C old diff --name-only)" = "include/veriqueue/spsc_queue.hpp"
          test "$(git -C attr diff --name-only)" = "include/veriqueue/spsc_queue.hpp"
          cmp current/bench/bench_hotpath_variants.cpp attr/bench/bench_hotpath_variants.cpp
          cmp current/bench/bench_hotpath_variants.cpp old/bench/bench_hotpath_variants.cpp
      - name: Build normal, localized-unroll, and old-header queues
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          for role in current attr old; do
            cmake -S "$role" -B "build/$role" -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DVERIQUEUE_BUILD_TESTS=OFF -DVERIQUEUE_BUILD_STRESS=OFF \
              -DVERIQUEUE_BUILD_BENCHMARKS=ON -DVERIQUEUE_BUILD_BASELINES=OFF
            cmake --build "build/$role" --target bench_hotpath_variants -j2
          done
      - name: Make bulk wrappers
        run: |
          for role in current attr old; do
            for batch in 4 16 64; do
              cat > "build/${role}/bench_bulk_${batch}" <<EOF
          #!/usr/bin/env bash
          exec "$GITHUB_WORKSPACE/build/${role}/bench_hotpath_variants" "\$1" "\$2" "\$3" "\$4" bulk ${batch}
          EOF
              chmod +x "build/${role}/bench_bulk_${batch}"
            done
          done
      - name: Compare localized candidate to current and old baseline
        run: |
          ROOT="attr/evidence/gcc-arm64-local-unroll/${{ matrix.compiler }}"
          mkdir -p "$ROOT"
          for ref in current old; do
            offset=0
            if [ "$ref" = "old" ]; then offset=100; fi
            OUT="$ROOT/vs-${ref}"
            mkdir -p "$OUT"
            python attr/tools/run_regression_campaign.py \
              --candidate "$GITHUB_WORKSPACE/build/attr/bench_hotpath_variants" \
              --reference "$GITHUB_WORKSPACE/build/${ref}/bench_hotpath_variants" \
              --capacities 256,1024 --payloads 8 --transfers 1000000 \
              --warmups 4 --repetitions 60 --seed "$((20262000 + offset))" \
              --output "$OUT/scalar-raw.jsonl"
            python attr/tools/analyze_regression_campaign.py "$OUT/scalar-raw.jsonl" \
              --json-output "$OUT/scalar-summary.json" --markdown-output "$OUT/scalar-summary.md" \
              --bootstrap-seed "$((20262001 + offset))" || true
            cat "$OUT/scalar-summary.md"
            for batch in 4 16 64; do
              python attr/tools/run_regression_campaign.py \
                --candidate "$GITHUB_WORKSPACE/build/attr/bench_bulk_${batch}" \
                --reference "$GITHUB_WORKSPACE/build/${ref}/bench_bulk_${batch}" \
                --capacities 256,1024 --payloads 8 --transfers 1000000 \
                --warmups 4 --repetitions 60 --seed "$((20262010 + batch + offset))" \
                --output "$OUT/bulk${batch}-raw.jsonl"
              python attr/tools/analyze_regression_campaign.py "$OUT/bulk${batch}-raw.jsonl" \
                --json-output "$OUT/bulk${batch}-summary.json" --markdown-output "$OUT/bulk${batch}-summary.md" \
                --bootstrap-seed "$((20262010 + batch + offset))" || true
              cat "$OUT/bulk${batch}-summary.md"
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gcc-arm64-local-unroll-${{ matrix.compiler }}
          path: attr/evidence/gcc-arm64-local-unroll/${{ matrix.compiler }}/
