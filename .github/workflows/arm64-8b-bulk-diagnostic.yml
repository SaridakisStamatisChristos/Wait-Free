name: ARM64 8B Bulk Diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/arm64-8b-bulk-diagnostic.yml'

permissions:
  contents: read

env:
  PRE_OPT: d1382588262b2275ecde9bf1a6948e67fcd056f3

jobs:
  unroll-sweep:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 55
    steps:
      - name: Checkout identical current trees
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: current
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: u4
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: u8
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: u16
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: old
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Inject old header and localized pragma candidates
        run: |
          git -C old fetch --no-tags --depth=1 origin "$PRE_OPT"
          git -C old show FETCH_HEAD:include/veriqueue/spsc_queue.hpp > old/include/veriqueue/spsc_queue.hpp
          python3 - <<'PY'
          from pathlib import Path

          push = '''        for (std::size_t i = 0; i < count; ++i) {
            std::construct_at(slot_for(tail).storage_ptr(), values[i]);
            ++tail;
        }
'''
          pop = '''        for (std::size_t i = 0; i < count; ++i) {
            T* const source = slot_for(head).live_ptr();
            output[i] = std::move(*source);
            std::destroy_at(source);
            ++head;
        }
'''
          for factor in (4, 8, 16):
              p = Path(f'u{factor}/include/veriqueue/spsc_queue.hpp')
              s = p.read_text()
              if s.count(push) != 1 or s.count(pop) != 1:
                  raise SystemExit(f'bulk loops not unique for u{factor}')
              push_opt = f'''#if defined(__aarch64__) && defined(__GNUC__) && !defined(__clang__)
        if constexpr (sizeof(detail::slot<T>) == 8) {{
#pragma GCC unroll {factor}
            for (std::size_t i = 0; i < count; ++i) {{
                std::construct_at(slot_for(tail).storage_ptr(), values[i]);
                ++tail;
            }}
        }} else
#endif
        {{
{push.rstrip()}
        }}
'''
              pop_opt = f'''#if defined(__aarch64__) && defined(__GNUC__) && !defined(__clang__)
        if constexpr (sizeof(detail::slot<T>) == 8) {{
#pragma GCC unroll {factor}
            for (std::size_t i = 0; i < count; ++i) {{
                T* const source = slot_for(head).live_ptr();
                output[i] = std::move(*source);
                std::destroy_at(source);
                ++head;
            }}
        }} else
#endif
        {{
{pop.rstrip()}
        }}
'''
              s = s.replace(push, push_opt, 1).replace(pop, pop_opt, 1)
              p.write_text(s)
          PY
          test "$(git -C old diff --name-only)" = "include/veriqueue/spsc_queue.hpp"
          for role in u4 u8 u16; do
            test "$(git -C "$role" diff --name-only)" = "include/veriqueue/spsc_queue.hpp"
            cmp current/bench/bench_hotpath_variants.cpp "$role/bench/bench_hotpath_variants.cpp"
          done
      - name: Build all variants
        env:
          CC: gcc
          CXX: g++
        run: |
          for role in current u4 u8 u16 old; do
            cmake -S "$role" -B "build/$role" -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DVERIQUEUE_BUILD_TESTS=OFF -DVERIQUEUE_BUILD_STRESS=OFF \
              -DVERIQUEUE_BUILD_BENCHMARKS=ON -DVERIQUEUE_BUILD_BASELINES=OFF
            cmake --build "build/$role" --target bench_hotpath_variants -j2
          done
      - name: Make bulk wrappers
        run: |
          for role in current u4 u8 u16 old; do
            for batch in 4 16 64; do
              cat > "build/${role}/bench_bulk_${batch}" <<EOF
          #!/usr/bin/env bash
          exec "$GITHUB_WORKSPACE/build/${role}/bench_hotpath_variants" "\$1" "\$2" "\$3" "\$4" bulk ${batch}
          EOF
              chmod +x "build/${role}/bench_bulk_${batch}"
            done
          done
      - name: Sweep unroll factors against current and old
        run: |
          ROOT="u8/evidence/gcc-arm64-unroll-sweep"
          mkdir -p "$ROOT"
          for role in u4 u8 u16; do
            factor="${role#u}"
            for ref in current old; do
              ref_offset=0
              if [ "$ref" = "old" ]; then ref_offset=100; fi
              OUT="$ROOT/${role}-vs-${ref}"
              mkdir -p "$OUT"
              for batch in 4 16 64; do
                python u8/tools/run_regression_campaign.py \
                  --candidate "$GITHUB_WORKSPACE/build/${role}/bench_bulk_${batch}" \
                  --reference "$GITHUB_WORKSPACE/build/${ref}/bench_bulk_${batch}" \
                  --capacities 256,1024 --payloads 8 --transfers 800000 \
                  --warmups 4 --repetitions 50 \
                  --seed "$((20262100 + factor * 10 + batch + ref_offset))" \
                  --output "$OUT/bulk${batch}-raw.jsonl"
                python u8/tools/analyze_regression_campaign.py "$OUT/bulk${batch}-raw.jsonl" \
                  --json-output "$OUT/bulk${batch}-summary.json" \
                  --markdown-output "$OUT/bulk${batch}-summary.md" \
                  --bootstrap-seed "$((20262100 + factor * 10 + batch + ref_offset))" || true
                cat "$OUT/bulk${batch}-summary.md"
              done
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gcc-arm64-8b-unroll-sweep
          path: u8/evidence/gcc-arm64-unroll-sweep/
