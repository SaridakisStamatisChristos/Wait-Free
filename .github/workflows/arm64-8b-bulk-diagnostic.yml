name: ARM64 8B Bulk Diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/arm64-8b-bulk-diagnostic.yml'

permissions:
  contents: read

env:
  CANDIDATE: 8be69e55318b5e37bbdf684bfdbeb72534c6d414
  CURRENT: 4c194617d5bded91ecb58063607c3fab47fc1db9
  PRE_OPT: d1382588262b2275ecde9bf1a6948e67fcd056f3

jobs:
  qualify-pr27:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            compiler: gcc
            cc: gcc
            cxx: g++
          - runner: ubuntu-24.04-arm
            compiler: clang
            cc: clang
            cxx: clang++
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - name: Checkout exact PR27 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE }}
          path: candidate
      - name: Checkout current production reference
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CURRENT }}
          path: current
          fetch-depth: 0
      - name: Checkout identical harness for pre-PR21 reference
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CURRENT }}
          path: old
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - name: Isolate queue implementation differences
        run: |
          git -C old fetch --no-tags --depth=1 origin "$PRE_OPT"
          git -C old show FETCH_HEAD:include/veriqueue/spsc_queue.hpp > old/include/veriqueue/spsc_queue.hpp
          test "$(git -C old diff --name-only)" = "include/veriqueue/spsc_queue.hpp"
          cmp candidate/bench/bench_hotpath_variants.cpp current/bench/bench_hotpath_variants.cpp
          cmp candidate/bench/bench_hotpath_variants.cpp old/bench/bench_hotpath_variants.cpp
          cmp candidate/tools/run_regression_campaign.py current/tools/run_regression_campaign.py
          cmp candidate/tools/analyze_regression_campaign.py current/tools/analyze_regression_campaign.py
      - name: Build candidate and references under identical compiler
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          for role in candidate current old; do
            cmake -S "$role" -B "build/$role" -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DVERIQUEUE_BUILD_TESTS=OFF -DVERIQUEUE_BUILD_STRESS=OFF \
              -DVERIQUEUE_BUILD_BENCHMARKS=ON -DVERIQUEUE_BUILD_BASELINES=OFF
            cmake --build "build/$role" --target bench_hotpath_variants -j2
          done
      - name: Make bulk wrappers
        run: |
          for role in candidate current old; do
            for batch in 4 16 64; do
              cat > "build/${role}/bench_bulk_${batch}" <<EOF
          #!/usr/bin/env bash
          exec "$GITHUB_WORKSPACE/build/${role}/bench_hotpath_variants" "\$1" "\$2" "\$3" "\$4" bulk ${batch}
          EOF
              chmod +x "build/${role}/bench_bulk_${batch}"
            done
          done
      - name: Run exact 8-byte target matrix vs current and old
        run: |
          ROOT="candidate/evidence/pr27-exact/${{ matrix.compiler }}"
          mkdir -p "$ROOT"
          for ref in current old; do
            offset=0
            if [ "$ref" = "old" ]; then offset=100; fi
            OUT="$ROOT/vs-${ref}"
            mkdir -p "$OUT"
            python candidate/tools/run_regression_campaign.py \
              --candidate "$GITHUB_WORKSPACE/build/candidate/bench_hotpath_variants" \
              --reference "$GITHUB_WORKSPACE/build/${ref}/bench_hotpath_variants" \
              --capacities 256,1024 --payloads 8 --transfers 1000000 \
              --warmups 4 --repetitions 60 --seed "$((20262200 + offset))" \
              --output "$OUT/scalar-raw.jsonl"
            python candidate/tools/analyze_regression_campaign.py "$OUT/scalar-raw.jsonl" \
              --json-output "$OUT/scalar-summary.json" --markdown-output "$OUT/scalar-summary.md" \
              --bootstrap-seed "$((20262201 + offset))" || true
            cat "$OUT/scalar-summary.md"
            for batch in 4 16 64; do
              python candidate/tools/run_regression_campaign.py \
                --candidate "$GITHUB_WORKSPACE/build/candidate/bench_bulk_${batch}" \
                --reference "$GITHUB_WORKSPACE/build/${ref}/bench_bulk_${batch}" \
                --capacities 256,1024 --payloads 8 --transfers 1000000 \
                --warmups 4 --repetitions 60 --seed "$((20262210 + batch + offset))" \
                --output "$OUT/bulk${batch}-raw.jsonl"
              python candidate/tools/analyze_regression_campaign.py "$OUT/bulk${batch}-raw.jsonl" \
                --json-output "$OUT/bulk${batch}-summary.json" \
                --markdown-output "$OUT/bulk${batch}-summary.md" \
                --bootstrap-seed "$((20262210 + batch + offset))" || true
              cat "$OUT/bulk${batch}-summary.md"
            done
          done
      - name: Run non-target payload controls vs current
        run: |
          OUT="candidate/evidence/pr27-exact/${{ matrix.compiler }}/non-target-vs-current"
          mkdir -p "$OUT"
          python candidate/tools/run_regression_campaign.py \
            --candidate "$GITHUB_WORKSPACE/build/candidate/bench_hotpath_variants" \
            --reference "$GITHUB_WORKSPACE/build/current/bench_hotpath_variants" \
            --capacities 256,1024 --payloads 16,64,256 --transfers 400000 \
            --warmups 3 --repetitions 30 --seed 20262300 \
            --output "$OUT/scalar-raw.jsonl"
          python candidate/tools/analyze_regression_campaign.py "$OUT/scalar-raw.jsonl" \
            --json-output "$OUT/scalar-summary.json" --markdown-output "$OUT/scalar-summary.md" \
            --bootstrap-seed 20262301 || true
          cat "$OUT/scalar-summary.md"
          python candidate/tools/run_regression_campaign.py \
            --candidate "$GITHUB_WORKSPACE/build/candidate/bench_bulk_64" \
            --reference "$GITHUB_WORKSPACE/build/current/bench_bulk_64" \
            --capacities 256,1024 --payloads 16,64,256 --transfers 400000 \
            --warmups 3 --repetitions 30 --seed 20262364 \
            --output "$OUT/bulk64-raw.jsonl"
          python candidate/tools/analyze_regression_campaign.py "$OUT/bulk64-raw.jsonl" \
            --json-output "$OUT/bulk64-summary.json" --markdown-output "$OUT/bulk64-summary.md" \
            --bootstrap-seed 20262364 || true
          cat "$OUT/bulk64-summary.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr27-exact-${{ matrix.compiler }}
          path: candidate/evidence/pr27-exact/${{ matrix.compiler }}/
