name: ARM64 8B Bulk Diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/arm64-8b-bulk-diagnostic.yml'

permissions:
  contents: read

env:
  PRE_OPT: d1382588262b2275ecde9bf1a6948e67fcd056f3
  POST_PR21: 73ef0b53de84c8169b198fd70b8f1a381858827c
  CURRENT: 4c194617d5bded91ecb58063607c3fab47fc1db9

jobs:
  attribute:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            compiler: gcc
            cc: gcc
            cxx: g++
          - runner: ubuntu-24.04-arm
            compiler: clang
            cc: clang
            cxx: clang++
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout identical current harnesses
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: old
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: pr21
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: current
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - name: Inject historical headers only
        run: |
          git -C old fetch --no-tags --depth=1 origin "$PRE_OPT"
          git -C old show FETCH_HEAD:include/veriqueue/spsc_queue.hpp > /tmp/old.hpp
          cp /tmp/old.hpp old/include/veriqueue/spsc_queue.hpp
          git -C old fetch --no-tags --depth=1 origin "$POST_PR21"
          git -C old show FETCH_HEAD:include/veriqueue/spsc_queue.hpp > /tmp/pr21.hpp
          cp /tmp/pr21.hpp pr21/include/veriqueue/spsc_queue.hpp
          test "$(git -C old diff --name-only)" = "include/veriqueue/spsc_queue.hpp"
          test "$(git -C pr21 diff --name-only)" = "include/veriqueue/spsc_queue.hpp"
          cmp old/bench/bench_hotpath_variants.cpp pr21/bench/bench_hotpath_variants.cpp
          cmp old/bench/bench_hotpath_variants.cpp current/bench/bench_hotpath_variants.cpp
      - name: Build historical queue headers under identical harness/compiler
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          for role in old pr21 current; do
            cmake -S "$role" -B "build/$role" -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DVERIQUEUE_BUILD_TESTS=OFF -DVERIQUEUE_BUILD_STRESS=OFF \
              -DVERIQUEUE_BUILD_BENCHMARKS=ON -DVERIQUEUE_BUILD_BASELINES=OFF
            cmake --build "build/$role" --target bench_hotpath_variants -j2
          done
      - name: Make bulk wrappers
        run: |
          for role in old pr21 current; do
            for batch in 4 64; do
              cat > "build/${role}/bench_bulk_${batch}" <<EOF
          #!/usr/bin/env bash
          exec "$GITHUB_WORKSPACE/build/${role}/bench_hotpath_variants" "\$1" "\$2" "\$3" "\$4" bulk ${batch}
          EOF
              chmod +x "build/${role}/bench_bulk_${batch}"
            done
          done
      - name: Compare PR21 and current directly to pre-optimization baseline
        run: |
          ROOT="current/evidence/history-attribution/${{ matrix.compiler }}"
          mkdir -p "$ROOT"
          for role in pr21 current; do
            offset=0
            if [ "$role" = "current" ]; then offset=100; fi
            OUT="$ROOT/${role}-vs-old"
            mkdir -p "$OUT"
            python current/tools/run_regression_campaign.py \
              --candidate "$GITHUB_WORKSPACE/build/${role}/bench_hotpath_variants" \
              --reference "$GITHUB_WORKSPACE/build/old/bench_hotpath_variants" \
              --capacities 256,1024 --payloads 8 --transfers 800000 \
              --warmups 4 --repetitions 50 --seed "$((20261600 + offset))" \
              --output "$OUT/scalar-raw.jsonl"
            python current/tools/analyze_regression_campaign.py "$OUT/scalar-raw.jsonl" \
              --json-output "$OUT/scalar-summary.json" --markdown-output "$OUT/scalar-summary.md" \
              --bootstrap-seed "$((20261601 + offset))" || true
            cat "$OUT/scalar-summary.md"
            for batch in 4 64; do
              python current/tools/run_regression_campaign.py \
                --candidate "$GITHUB_WORKSPACE/build/${role}/bench_bulk_${batch}" \
                --reference "$GITHUB_WORKSPACE/build/old/bench_bulk_${batch}" \
                --capacities 256,1024 --payloads 8 --transfers 800000 \
                --warmups 4 --repetitions 50 --seed "$((20261610 + batch + offset))" \
                --output "$OUT/bulk${batch}-raw.jsonl"
              python current/tools/analyze_regression_campaign.py "$OUT/bulk${batch}-raw.jsonl" \
                --json-output "$OUT/bulk${batch}-summary.json" --markdown-output "$OUT/bulk${batch}-summary.md" \
                --bootstrap-seed "$((20261610 + batch + offset))" || true
              cat "$OUT/bulk${batch}-summary.md"
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: history-attribution-${{ matrix.compiler }}
          path: current/evidence/history-attribution/${{ matrix.compiler }}/
