name: Benchmark Evidence

on:
  workflow_dispatch:
  schedule:
    - cron: '43 3 * * 0'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Machine info
        run: |
          mkdir -p evidence/benchmarks
          tools/collect_machine_info.sh > evidence/benchmarks/machine.txt
      - name: Build benchmarks
        run: |
          cmake -S . -B build/bench -G Ninja -DCMAKE_BUILD_TYPE=Release -DVERIQUEUE_BUILD_TESTS=OFF -DVERIQUEUE_BUILD_STRESS=OFF -DVERIQUEUE_BUILD_BENCHMARKS=ON -DVERIQUEUE_BUILD_BASELINES=ON
          cmake --build build/bench -j2
      - name: Native benchmark campaign
        run: python tools/run_bench.py --build build/bench --repetitions 20 --output evidence/benchmarks/raw.jsonl
      - name: Baselines
        run: |
          for i in $(seq 1 20); do ./build/bench/bench_compare; done > evidence/benchmarks/baselines.jsonl
      - name: Analyze
        run: |
          python tools/analyze_bench.py evidence/benchmarks/raw.jsonl | tee evidence/benchmarks/summary.txt
          CXX=c++ tools/audit_assembly.sh evidence/benchmarks/assembly.s | tee evidence/benchmarks/assembly-audit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-evidence-shared-runner
          path: evidence/benchmarks/
