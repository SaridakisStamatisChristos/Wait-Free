name: Freeze GitHub Evidence

on:
  workflow_dispatch:
    inputs:
      run_ids:
        description: 'Comma-separated successful GitHub Actions run IDs from one source commit'
        required: true
        type: string
      campaign_date:
        description: 'Optional YYYY-MM-DD campaign date; defaults to earliest source run date'
        required: false
        type: string

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: evidence-freeze-${{ github.event.inputs.run_ids }}
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Confirm production freezer is running from default branch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "$DEFAULT_BRANCH" ]] || {
            echo "Evidence freezer must be dispatched from the default branch '$DEFAULT_BRANCH'." >&2
            exit 1
          }

      - name: Freeze selected GitHub Actions evidence
        id: freeze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_IDS: ${{ github.event.inputs.run_ids }}
          CAMPAIGN_DATE: ${{ github.event.inputs.campaign_date }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --repository "$GITHUB_REPOSITORY"
            --run-ids "$SOURCE_RUN_IDS"
            --output-base evidence/campaigns
            --result-json /tmp/evidence-freeze-result.json
          )
          if [[ -n "$CAMPAIGN_DATE" ]]; then
            args+=(--campaign-date "$CAMPAIGN_DATE")
          fi
          python tools/freeze_github_evidence.py "${args[@]}"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          result = json.load(open('/tmp/evidence-freeze-result.json', encoding='utf-8'))
          print(f"campaign_root={result['campaign_root']}")
          print(f"source_commit={result['source_commit']}")
          print(f"campaign_date={result['campaign_date']}")
          PY

      - name: Independently verify frozen campaign
        shell: bash
        run: python tools/verify_frozen_evidence.py "${{ steps.freeze.outputs.campaign_root }}"

      - name: Reject oversized Git objects
        shell: bash
        run: |
          set -euo pipefail
          oversized="$(find "${{ steps.freeze.outputs.campaign_root }}" -type f -size +95M -print -quit)"
          if [[ -n "$oversized" ]]; then
            echo "Frozen evidence contains a file larger than 95 MiB: $oversized" >&2
            exit 1
          fi

      - name: Create permanent evidence branch and pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CAMPAIGN_ROOT: ${{ steps.freeze.outputs.campaign_root }}
          SOURCE_COMMIT: ${{ steps.freeze.outputs.source_commit }}
          CAMPAIGN_DATE: ${{ steps.freeze.outputs.campaign_date }}
          SOURCE_RUN_IDS: ${{ github.event.inputs.run_ids }}
        shell: bash
        run: |
          set -euo pipefail
          branch="evidence/freeze-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add "$CAMPAIGN_ROOT"
          git diff --cached --quiet && {
            echo 'Evidence freezer produced no repository changes.' >&2
            exit 1
          }
          git commit -m "evidence: freeze GitHub campaign ${CAMPAIGN_DATE}"
          git push origin "$branch"

          cat > /tmp/evidence-pr-body.md <<EOF
          ## GitHub-only evidence freeze

          Source commit: \`${SOURCE_COMMIT}\`
          Source Actions run IDs: \`${SOURCE_RUN_IDS}\`
          Campaign root: \`${CAMPAIGN_ROOT}\`

          This PR was generated by the GitHub Evidence Freezer from successful Actions artifacts that share one source commit. The committed campaign contains:

          - extracted GitHub Actions artifact payloads
          - source-run and artifact provenance in \`manifest.json\`
          - GitHub-provided artifact archive digests where available
          - a complete \`SHA256SUMS.txt\` ledger
          - independent freeze verification before commit

          No benchmark value or qualification result is manually edited by this workflow.
          EOF

          gh pr create \
            --base "$DEFAULT_BRANCH" \
            --head "$branch" \
            --title "Evidence freeze: ${CAMPAIGN_DATE} ${SOURCE_COMMIT:0:12}" \
            --body-file /tmp/evidence-pr-body.md
