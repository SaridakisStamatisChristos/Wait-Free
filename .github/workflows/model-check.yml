name: Model Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Relacy
        run: cmake -S . -B build/relacy -G Ninja -DVERIQUEUE_BUILD_TESTS=OFF -DVERIQUEUE_BUILD_STRESS=OFF -DVERIQUEUE_BUILD_RELACY=ON
      - name: Build
        run: cmake --build build/relacy --target spsc_relacy spsc_single_owner_relacy -j2
      - name: Verify legacy and single-owner protocols
        run: |
          mkdir -p evidence/relacy
          {
            echo "commit=$GITHUB_SHA"
            c++ --version | head -1
            echo "=== legacy dual-owner model ==="
            ./build/relacy/spsc_relacy
            echo "=== ARM64 single-owner model ==="
            ./build/relacy/spsc_single_owner_relacy
          } 2>&1 | tee evidence/relacy/relacy.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relacy-evidence
          path: evidence/relacy/relacy.log

  linearizability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: verify/linearizability/go.mod
      - name: Build history generator
        run: |
          cmake -S . -B build/lin -G Ninja -DVERIQUEUE_BUILD_TESTS=OFF -DVERIQUEUE_BUILD_STRESS=OFF -DVERIQUEUE_BUILD_LINEARIZABILITY=ON
          cmake --build build/lin --target history_generator -j2
      - name: Build independent Porcupine checker
        working-directory: verify/linearizability
        run: |
          go mod download
          go build -o ../../build/lin/history_checker .
      - name: Run reproducible history matrix
        run: |
          python tools/run_linearizability_campaign.py \
            --capacities 1,2,4,8 \
            --profiles uniform,burst,producer-heavy,consumer-heavy \
            --seeds 8 \
            --ops-per-side 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linearizability-evidence
          path: |
            evidence/linearizability/
            verify/histories/corpus/*.json

  linearizability-single-owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: verify/linearizability/go.mod
      - name: Build forced single-owner history generator
        run: |
          cmake -S . -B build/lin -G Ninja -DVERIQUEUE_BUILD_TESTS=OFF -DVERIQUEUE_BUILD_STRESS=OFF -DVERIQUEUE_BUILD_LINEARIZABILITY=ON
          cmake --build build/lin --target history_generator_single_owner -j2
      - name: Build independent Porcupine checker
        working-directory: verify/linearizability
        run: |
          go mod download
          go build -o ../../build/lin/history_checker .
      - name: Run reproducible single-owner history matrix
        run: |
          python tools/run_linearizability_campaign.py \
            --generator build/lin/history_generator_single_owner \
            --capacities 1,2,4,8 \
            --profiles uniform,burst,producer-heavy,consumer-heavy \
            --seeds 8 \
            --ops-per-side 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linearizability-single-owner-evidence
          path: |
            evidence/linearizability/
            verify/histories/corpus/*.json

  mutation-campaign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/run_mutation_campaign.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-evidence
          path: |
            evidence/relacy/mutation-results.json
            evidence/relacy/mutation-matrix.csv
            evidence/relacy/mutation-summary.md
