name: ARM Loss Recovery Lab

on:
  workflow_dispatch:
    inputs:
      transfers:
        description: Transfers per measured process
        required: true
        default: '250000'
        type: string
      warmups:
        description: Warmup rounds per cell
        required: true
        default: '2'
        type: string
      repetitions:
        description: Measured rounds per cell
        required: true
        default: '12'
        type: string
  pull_request:
    paths:
      - 'bench/arm_loss_variants.hpp'
      - 'bench/bench_arm_loss_compare.cpp'
      - '.github/workflows/arm-loss-recovery-lab.yml'

permissions:
  contents: read

concurrency:
  group: arm-loss-recovery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  ARM_LOSS_CANDIDATES: veriqueue,raw_cached_seq,raw_cached_global,raw_cached_tiled,tile32_l8,tile64_l8,tile128_l8,tile256_l8
  ARM_LOSS_EXTERNALS: rigtorp,boost_lockfree,moodycamel,drogalis
  ARM_LOSS_IMPLEMENTATIONS: veriqueue,raw_cached_seq,raw_cached_global,raw_cached_tiled,tile32_l8,tile64_l8,tile128_l8,tile256_l8,rigtorp,boost_lockfree,moodycamel,drogalis

jobs:
  tooling:
    name: arm-loss-tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate analyzers
        run: |
          python -m py_compile tools/run_comparator_campaign.py tools/analyze_policy_campaign.py
          python tools/test_policy_campaign.py
      - name: Compile local-stripe candidate on host
        run: |
          g++ -std=c++20 -O3 -DNDEBUG -pthread \
            -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Wold-style-cast -Wcast-align -Wundef -Werror \
            -Iinclude -Ibench -x c++ -o /tmp/arm-loss-smoke - <<'CPP'
          #include "arm_loss_variants.hpp"
          #include <array>
          #include <cstdint>
          struct p16 { std::uint64_t a; std::uint64_t b; };
          int main() {
              using q = vqbench::experimental::arm_loss::tile64_l8<p16, 256>;
              q queue;
              p16 in{1,2}, out{};
              if (!queue.try_push(in) || !queue.try_pop(out)) return 1;
              return (out.a == 1 && out.b == 2) ? 0 : 2;
          }
          CPP
          /tmp/arm-loss-smoke

  compare:
    name: arm64 / ${{ matrix.compiler }} / cap-${{ matrix.capacity }}
    needs: tooling
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        capacity: [64, 256, 1024, 65536]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install benchmark dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libboost-dev clang
      - name: Select compiler
        id: compiler
        shell: bash
        run: |
          if [[ "${{ matrix.compiler }}" == "gcc" ]]; then
            echo "cc=gcc" >> "$GITHUB_OUTPUT"
            echo "cxx=g++" >> "$GITHUB_OUTPUT"
            echo "compiler_id=1" >> "$GITHUB_OUTPUT"
          else
            echo "cc=clang" >> "$GITHUB_OUTPUT"
            echo "cxx=clang++" >> "$GITHUB_OUTPUT"
            echo "compiler_id=2" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch pinned comparator sources through CMake
        env:
          CC: ${{ steps.compiler.outputs.cc }}
          CXX: ${{ steps.compiler.outputs.cxx }}
        run: |
          cmake -S . -B build/arm-loss -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DVERIQUEUE_BUILD_TESTS=OFF \
            -DVERIQUEUE_BUILD_STRESS=OFF \
            -DVERIQUEUE_BUILD_BENCHMARKS=OFF \
            -DVERIQUEUE_BUILD_BASELINES=ON
      - name: Compile ARM loss comparator
        env:
          CXX: ${{ steps.compiler.outputs.cxx }}
        run: |
          "$CXX" -std=c++20 -O3 -DNDEBUG -pthread \
            -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Wold-style-cast -Wcast-align -Wundef -Werror \
            -DVERIQUEUE_POLICY_CAPACITY=${{ matrix.capacity }} \
            -Iinclude -Ibench \
            -isystem build/arm-loss/_deps/rigtorp_spsc-src/include \
            -isystem build/arm-loss/_deps/moodycamel_readerwriterqueue-src \
            -isystem build/arm-loss/_deps/drogalis_spsc-src/include \
            bench/bench_arm_loss_compare.cpp bench/environment.cpp \
            -o build/arm-loss/bench_arm_loss_compare
      - name: Run randomized recovery campaign
        env:
          TRANSFERS: ${{ github.event_name == 'workflow_dispatch' && inputs.transfers || '150000' }}
          WARMUPS: ${{ github.event_name == 'workflow_dispatch' && inputs.warmups || '1' }}
          REPETITIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.repetitions || '8' }}
        run: |
          compiler_id=${{ steps.compiler.outputs.compiler_id }}
          seed=$((2026101200 + compiler_id * 10000 + ${{ matrix.capacity }}))
          output="evidence/arm-loss/raw/arm64-${{ matrix.compiler }}-cap${{ matrix.capacity }}.jsonl"
          python tools/run_comparator_campaign.py \
            --program build/arm-loss/bench_arm_loss_compare \
            --capacity "${{ matrix.capacity }}" \
            --payloads 8,16,64,256 \
            --implementations "$ARM_LOSS_IMPLEMENTATIONS" \
            --transfers "$TRANSFERS" \
            --warmups "$WARMUPS" \
            --repetitions "$REPETITIONS" \
            --seed "$seed" \
            --lane "arm64-${{ matrix.compiler }}" \
            --architecture arm64 \
            --compiler "${{ matrix.compiler }}" \
            --source-commit "${{ env.SOURCE_COMMIT }}" \
            --output "$output"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: arm-loss-${{ matrix.compiler }}-cap${{ matrix.capacity }}
          path: evidence/arm-loss/raw/*.jsonl
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: aggregate-arm-loss-results
    needs: compare
    if: ${{ always() && needs.compare.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: arm-loss-*
          path: evidence/arm-loss/shards
          merge-multiple: true
      - name: Analyze recovery candidates
        run: |
          python tools/analyze_policy_campaign.py evidence/arm-loss/shards \
            --candidates "$ARM_LOSS_CANDIDATES" \
            --externals "$ARM_LOSS_EXTERNALS" \
            --json-output evidence/arm-loss/summary.json \
            --markdown-output evidence/arm-loss/summary.md \
            --csv-output evidence/arm-loss/cells.csv \
            --bootstrap-seed 20261012 \
            --bootstrap-samples 10000
          cat evidence/arm-loss/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: arm-loss-summary
          path: |
            evidence/arm-loss/summary.json
            evidence/arm-loss/summary.md
            evidence/arm-loss/cells.csv
          if-no-files-found: error
          retention-days: 90
