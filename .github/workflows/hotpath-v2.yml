name: Hot-path V2 Ablation

on:
  pull_request:
    paths:
      - 'bench/experimental_spsc_v2.hpp'
      - 'bench/experimental_spsc_round2.hpp'
      - 'bench/bench_hotpath_v2.cpp'
      - 'tools/run_hotpath_v2.py'
      - 'tools/analyze_hotpath_v2.py'
      - 'tools/assembly_hotpath_v2_probe.cpp'
      - 'tools/analyze_hotpath_v2_assembly.py'
      - 'tools/test_hotpath_v2_wrap.cpp'
      - '.github/workflows/hotpath-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-ablation:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64-gcc
            runner: ubuntu-24.04
            cc: gcc
            cxx: g++
            arch: x64
            topology_policy: x64-diagnostic
          - name: x64-clang
            runner: ubuntu-24.04
            cc: clang
            cxx: clang++
            arch: x64
            topology_policy: x64-diagnostic
          - name: arm64-gcc
            runner: ubuntu-24.04-arm
            cc: gcc
            cxx: g++
            arch: arm64
            topology_policy: default
          - name: arm64-clang
            runner: ubuntu-24.04-arm
            cc: clang
            cxx: clang++
            arch: arm64
            topology_policy: default
    name: focused / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4

      - name: Record environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/hotpath-v2
          {
            echo "commit=$GITHUB_SHA"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "platform=${{ matrix.name }}"
            "$CXX" --version | head -1
            uname -a
            python tools/topology_matrix.py
          } | tee evidence/hotpath-v2/environment.txt

      - name: Validate Python tooling
        run: >-
          python -m py_compile
          tools/topology_matrix.py
          tools/run_hotpath_v2.py
          tools/analyze_hotpath_v2.py
          tools/analyze_hotpath_v2_assembly.py

      - name: Build experimental benchmark and wrap verifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          "$CXX" -std=c++20 -O3 -DNDEBUG -pthread -Wall -Wextra -Wpedantic -Werror \
            -Iinclude -Ibench bench/bench_hotpath_v2.cpp bench/environment.cpp \
            -o build/bench_hotpath_v2
          "$CXX" -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror \
            -Iinclude -Ibench tools/test_hotpath_v2_wrap.cpp \
            -o build/test_hotpath_v2_wrap

      - name: Verify uint32 cursor rollover
        run: ./build/test_hotpath_v2_wrap

      - name: Round-2 correctness and affinity smoke
        shell: bash
        run: |
          set -euo pipefail
          for variant in \
            production \
            split_atomic_owner \
            split_atomic_cached_limit \
            split_local_owner \
            split_local_cached_limit \
            split_atomic_owner_128 \
            single_owner_u32 \
            single_owner_narrow; do
            ./build/bench_hotpath_v2 "$variant" 64 8 10000 scalar 1
          done
          # At capacity 1024 this uses uint16_t and 100k transfers crosses wrap.
          ./build/bench_hotpath_v2 single_owner_narrow 1024 8 100000 scalar 1

      - name: Generate and audit assembly
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/hotpath-v2/assembly
          for payload in 8 16 64 256; do
            "$CXX" -std=c++20 -O3 -DNDEBUG -S \
              -DVQ_PAYLOAD_BYTES="$payload" -Iinclude -Ibench \
              tools/assembly_hotpath_v2_probe.cpp \
              -o "evidence/hotpath-v2/assembly/payload-${payload}.s"
            python tools/analyze_hotpath_v2_assembly.py \
              "evidence/hotpath-v2/assembly/payload-${payload}.s" \
              --arch '${{ matrix.arch }}' \
              --compiler '${{ matrix.cxx }}' \
              --payload "$payload" \
              --json-output "evidence/hotpath-v2/assembly/payload-${payload}.json" \
              --markdown-output "evidence/hotpath-v2/assembly/payload-${payload}.md"
          done

      - name: Run round-2 focused scalar campaign
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/hotpath-v2/raw
          run_cell() {
            local capacity="$1"
            local payload="$2"
            local seed="$3"
            python tools/run_hotpath_v2.py \
              --program build/bench_hotpath_v2 \
              --capacities "$capacity" \
              --payloads "$payload" \
              --mode scalar \
              --transfers 100000 \
              --warmups 5 \
              --repetitions 30 \
              --seed "$seed" \
              --variants \
                production \
                split_atomic_owner \
                split_atomic_cached_limit \
                split_local_owner \
                split_local_cached_limit \
                split_atomic_owner_128 \
                single_owner_u32 \
                single_owner_narrow \
              --topology-policy '${{ matrix.topology_policy }}' \
              --output "evidence/hotpath-v2/raw/c${capacity}-p${payload}.jsonl"
          }
          run_cell 1024 8 20261020
          run_cell 1024 16 20261021
          run_cell 1024 256 20261022
          run_cell 64 8 20261023
          run_cell 256 8 20261024
          run_cell 65536 8 20261025

      - name: Analyze paired campaign
        shell: bash
        run: |
          set -euo pipefail
          python tools/analyze_hotpath_v2.py evidence/hotpath-v2/raw/*.jsonl \
            --require-repetitions 30 \
            --bootstrap-seed 20261020 \
            --json-output evidence/hotpath-v2/summary.json \
            --markdown-output evidence/hotpath-v2/summary.md
          cat evidence/hotpath-v2/summary.md

      - name: Round-2 bulk correctness smoke
        shell: bash
        run: |
          set -euo pipefail
          for batch in 4 16 64; do
            for variant in \
              production \
              split_atomic_owner \
              split_atomic_cached_limit \
              split_local_owner \
              split_local_cached_limit \
              split_atomic_owner_128 \
              single_owner_u32 \
              single_owner_narrow; do
              ./build/bench_hotpath_v2 "$variant" 1024 8 10000 bulk "$batch"
            done
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hotpath-v2-${{ matrix.name }}
          path: evidence/hotpath-v2/
          if-no-files-found: error
